<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🥚 蛋仔避闪电 · Eggy Lightning Dodge</title>
<style>
  :root{
    --bg-1:#1a1a2e; --bg-2:#16213e; --bg-3:#0f3460;
    --panel:#0e1a22; --text:#e2e8f0; --muted:#94a3b8;
    --accent:#fbbf24; --warn:#ef4444; --bolt:#a78bfa;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg,var(--bg-1),var(--bg-2),var(--bg-3));
    color:var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:16px; user-select:none;
  }
  h1{ margin:0 0 6px; font-size:24px; letter-spacing:1px; }
  h1 span{ color:var(--accent); }
  .sub{ color:var(--muted); margin-bottom:12px; font-size:12px; }
  .wrap{
    width:432px; max-width:100%;
    background:var(--panel); padding:16px; border-radius:18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .stats{
    display:flex; gap:6px; justify-content:space-between; align-items:center;
    margin: 4px 4px 10px; font-size:13px;
  }
  .stats div{ color:var(--muted); white-space:nowrap; }
  .stats b{ color:var(--accent); margin-left:4px; font-weight:700; }
  canvas{
    width:100%; height:auto; aspect-ratio:5 / 7;
    background: radial-gradient(circle at 50% 30%, #1e2a4a, #0d1424);
    border-radius:12px; display:block;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.05);
    touch-action: none;
  }
  .pad-help{ color:var(--muted); font-size:11px; margin-top:10px; text-align:center; line-height:1.7; }
  .pad-help kbd{
    background:#0b1a22; border:1px solid #1f3a48; padding:1px 5px; border-radius:4px;
    font-family:inherit; font-size:10px; color:var(--text);
  }
  .actions{ display:flex; gap:10px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
  .actions button{
    background:var(--accent); color:#3a2a00; border:none; padding:8px 16px;
    border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; letter-spacing:1px;
  }
  .actions button.secondary{ background:#0b1a22; color:var(--text); border:1px solid #1f3a48; }
  .actions button:active{ transform:scale(.96); }
  .badge{
    display:inline-block; font-size:10px; padding:2px 7px; border-radius:999px;
    background:rgba(239,68,68,.15); color:#fca5a5; border:1px solid rgba(239,68,68,.35);
    margin-left:6px; vertical-align:middle;
  }
  @media (max-width:420px){
    body{ padding:10px; justify-content:flex-start; }
    h1{ margin-top:4px; font-size:20px; text-align:center; }
    .sub{ text-align:center; margin-bottom:8px; }
    .wrap{ padding:10px; border-radius:14px; }
    .stats{ font-size:11px; margin-inline:0; }
    .actions{ gap:6px; }
    .actions button{ padding:8px 12px; }
  }
</style>
</head>
<body>

<h1>🥚 蛋仔避闪电 <span>· Eggy</span> <span class="badge">⚡ 躲雷</span></h1>
<div class="sub">追踪雷会锁定当前位置，后期雷阵会连续压迫，必须持续移动！</div>

<div class="wrap">
  <div class="stats">
    <div>存活<b id="time">0.0</b>s</div>
    <div>躲避<b id="dodge">0</b></div>
    <div>连躲<b id="combo">x0</b></div>
    <div>难度<b id="level">Lv.1</b></div>
    <div>最高<b id="best">0</b>s</div>
  </div>
  <canvas id="game" width="400" height="560" role="img" aria-label="蛋仔避闪电游戏区域">您的浏览器不支持 Canvas，请使用最新版 Chrome、Edge 或 Firefox。</canvas>

  <div class="pad-help">
    键盘 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>WASD</kbd> 移动 ·
    触屏 <b>点击/拖动移动</b> · <kbd>Space</kbd> 暂停 · <kbd>R</kbd> 重开
  </div>

  <div class="actions">
    <button id="startBtn">开始</button>
    <button class="secondary" id="pauseBtn">暂停</button>
    <button class="secondary" id="muteBtn">🔊 音效</button>
    <button class="secondary" id="resetBtn">重置</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // === 蛋仔 ===
  const eggy = {
    x: W/2, y: H*0.7, r: 18,
    vx: 0, vy: 0,
    color: '#fde68a', face: '#ffffff',
    blink: 0, squash: 0
  };

  function loadBest(){
    try{
      const value = Number(localStorage.getItem('eggy_best'));
      return Number.isFinite(value) && value > 0 ? value : 0;
    }catch(e){
      return 0;
    }
  }
  function saveBest(){
    try{ localStorage.setItem('eggy_best', best.toFixed(1)); }catch(e){}
  }
  // === 状态 ===
  let bolts = [];          // {x, y, r, phase, timer, life, seed}
  let frame = 0;
  let survived = 0;        // 秒
  let dodged = 0;
  let combo = 0;
  let best = loadBest();
  let alive = true, paused = false, started = false, muted = false;
  let spawnTimer = 60;
  let warnFrames = 95;     // 预警时长（帧），随难度缩短
  let lastDeath = null;     // 死亡诊断信息
  let difficulty = 1;
  let level = 1, boostTimer = 0, bannerTimer = 0, bannerText = '';
  let waveNumber = 0, lastWaveSize = 1;
  let pointerTarget = null;

  // === DOM ===
  const timeEl = document.getElementById('time');
  const dodgeEl = document.getElementById('dodge');
  const comboEl = document.getElementById('combo');
  const levelEl = document.getElementById('level');
  const bestEl = document.getElementById('best');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const muteBtn = document.getElementById('muteBtn');
  const resetBtn = document.getElementById('resetBtn');
  bestEl.textContent = best.toFixed(1);

  // === 音效 (WebAudio) ===
  let actx = null;
  function audio(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
  function unlockAudio(){
    if(muted) return;
    try{
      const a = audio();
      if(a.state === 'suspended') a.resume();
    }catch(e){}
  }
  function playWarn(){
    if(muted) return;
    try{
      const a = audio();
      const o = a.createOscillator(), g = a.createGain();
      o.type='square'; o.frequency.value=880;
      g.gain.setValueAtTime(0.08, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+0.12);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime+0.12);
    }catch(e){}
  }
  function playBolt(){
    if(muted) return;
    try{
      const a = audio();
      // 噪声爆破
      const buf = a.createBuffer(1, a.sampleRate*0.3, a.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/d.length,2);
      const src = a.createBufferSource(); src.buffer = buf;
      const g = a.createGain(); g.gain.value = 0.35;
      const f = a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1200;
      src.connect(f); f.connect(g); g.connect(a.destination);
      src.start();
      // 低频轰鸣
      const o = a.createOscillator(), og = a.createGain();
      o.type='sine'; o.frequency.setValueAtTime(120, a.currentTime);
      o.frequency.exponentialRampToValueAtTime(40, a.currentTime+0.3);
      og.gain.setValueAtTime(0.3, a.currentTime);
      og.gain.exponentialRampToValueAtTime(0.001, a.currentTime+0.35);
      o.connect(og); og.connect(a.destination);
      o.start(); o.stop(a.currentTime+0.35);
    }catch(e){}
  }

  // === 画蛋仔 ===
  function drawEggy(){
    const e = eggy;
    ctx.save();
    ctx.translate(e.x, e.y);
    const sq = 1 + e.squash*0.3;
    ctx.scale(1/sq, sq);

    if(boostTimer > 0){
      const pulse = 0.55 + Math.sin(frame*0.25)*0.2;
      ctx.strokeStyle = `rgba(251,191,36,${pulse})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(0, -2, e.r*1.65, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // 影子
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, e.r+4, e.r*0.9, 4, 0, 0, Math.PI*2); ctx.fill();

    // 身体（蛋形：下宽上窄）
    ctx.fillStyle = e.inDanger ? (frame%10<5 ? '#ef4444' : '#f87171') : e.color;
    ctx.beginPath();
    ctx.moveTo(0, -e.r*1.3);
    ctx.bezierCurveTo(e.r*1.1, -e.r*1.3, e.r*1.1, e.r*1.1, 0, e.r*1.1);
    ctx.bezierCurveTo(-e.r*1.1, e.r*1.1, -e.r*1.1, -e.r*1.3, 0, -e.r*1.3);
    ctx.fill();
    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(-e.r*0.35, -e.r*0.4, e.r*0.3, e.r*0.5, -0.4, 0, Math.PI*2); ctx.fill();

    // 腮红
    ctx.fillStyle = 'rgba(244,114,182,0.5)';
    ctx.beginPath(); ctx.arc(-e.r*0.5, -e.r*0.05, e.r*0.22, 0, Math.PI*2);
    ctx.arc(e.r*0.5, -e.r*0.05, e.r*0.22, 0, Math.PI*2); ctx.fill();

    // 眼睛
    const eyeY = -e.r*0.45;
    if(e.blink > 0){
      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-e.r*0.45, eyeY); ctx.lineTo(-e.r*0.15, eyeY);
      ctx.moveTo(e.r*0.15, eyeY); ctx.lineTo(e.r*0.45, eyeY); ctx.stroke();
    } else {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-e.r*0.3, eyeY, e.r*0.2, 0, Math.PI*2);
      ctx.arc(e.r*0.3, eyeY, e.r*0.2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1e293b';
      ctx.beginPath(); ctx.arc(-e.r*0.27, eyeY+1, e.r*0.1, 0, Math.PI*2);
      ctx.arc(e.r*0.33, eyeY+1, e.r*0.1, 0, Math.PI*2); ctx.fill();
    }
    // 嘴
    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, -e.r*0.1, e.r*0.18, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();

    // 小脚
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath(); ctx.ellipse(-e.r*0.3, e.r*1.05, e.r*0.22, e.r*0.14, 0, 0, Math.PI*2);
    ctx.ellipse(e.r*0.3, e.r*1.05, e.r*0.22, e.r*0.14, 0, 0, Math.PI*2); ctx.fill();

    ctx.restore();
  }

  // === 画闪电 ===
  function drawBolt(b){
    const blink = (b.timer % 12) < 7;
    if(b.phase === 'warn'){
      // 地面预警圈（红色，闪烁）= 实际致命区，所见即所危
      ctx.save();
      // 细雷线
      ctx.strokeStyle = 'rgba(167,139,250,0.5)';
      ctx.lineWidth = 2; ctx.setLineDash([6,6]);
      ctx.beginPath(); ctx.moveTo(b.x, 0); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.setLineDash([]);
      // 危险区（浅红填充+红圈，蛋仔圆心进入即死，所见即所危）
      ctx.fillStyle = b.aimed ? (blink ? 'rgba(249,115,22,0.50)' : 'rgba(249,115,22,0.28)') : (blink ? 'rgba(239,68,68,0.45)' : 'rgba(239,68,68,0.25)');
      ctx.beginPath(); ctx.arc(b.x, b.y, b.danger, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = b.aimed ? (blink ? '#fb923c' : 'rgba(249,115,22,0.85)') : (blink ? '#ff5555' : 'rgba(239,68,68,0.8)');
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.danger, 0, Math.PI*2); ctx.stroke();
      // ⚡ 图标
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(b.aimed ? (b.trackTimer > 0 ? '◎' : '◆') : '⚡', b.x, b.y - b.danger - 14);
      ctx.restore();
    } else if(b.phase === 'strike'){
      // 主闪电束（锯齿）+ 地面爆炸
      ctx.save();
      const grad = ctx.createLinearGradient(b.x, 0, b.x, b.y);
      grad.addColorStop(0, 'rgba(255,255,255,0.9)');
      grad.addColorStop(1, 'rgba(167,139,250,0.9)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 6;
      ctx.shadowColor = '#a78bfa'; ctx.shadowBlur = 16;
      ctx.beginPath();
      let y = 0, x = b.x;
      ctx.moveTo(x, y);
      const segs = 8;
      for(let i=1;i<=segs;i++){
        y = (b.y)*i/segs;
        x = b.x + (Math.sin(i*1.7 + b.seed)*18) * (1 - i/segs*0.3);
        ctx.lineTo(x, y);
      }
      ctx.stroke();
      // 内白芯
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.shadowBlur=0;
      ctx.beginPath();
      y=0; x=b.x; ctx.moveTo(x,y);
      for(let i=1;i<=segs;i++){ y=b.y*i/segs; x=b.x+Math.sin(i*1.7+b.seed)*18*(1-i/segs*0.3); ctx.lineTo(x,y); }
      ctx.stroke();
      // 爆炸圈（致命半径）
      const p = Math.max(0, Math.min(1, 1 - b.timer/b.life));
      ctx.strokeStyle = `rgba(255,255,255,${1-p})`;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.danger*(0.6+p*1.4), 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = `rgba(251,191,36,${0.4*(1-p)})`;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.danger, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    } else if(b.phase === 'fade'){
      const a = b.timer / b.life;
      ctx.fillStyle = `rgba(120,80,160,${a*0.3})`;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.danger*0.7, 0, Math.PI*2); ctx.fill();
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // 背景星点
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    for(let i=0;i<20;i++){
      const sx = (i*53 + frame*0.2)%W;
      const sy = (i*89)%H;
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }

    for(const b of bolts) drawBolt(b);
    if(alive || !started) drawEggy();

    if(!started){
      ctx.fillStyle='rgba(0,0,0,0.38)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fbbf24'; ctx.textAlign='center';
      ctx.font='bold 22px -apple-system, sans-serif';
      ctx.fillText('🥚 蛋仔避闪电', W/2, H/2 - 16);
      ctx.font='12px -apple-system, sans-serif'; ctx.fillStyle='#cbd5e1';
      ctx.fillText('红圈出现就快跑 · 触屏拖动蛋仔', W/2, H/2 + 12);
      ctx.fillText('按“开始”或回车键开局', W/2, H/2 + 32);
      ctx.fillText('每 10 秒升级 · 追踪雷锁定后再冲刺', W/2, H/2 + 50);
    }

    // 前两级保留危险提示，进入雷暴阶段后显示场上威胁数量。
    if(started && alive){
      const inCore = bolts.some(b => b.phase === 'warn' && Math.hypot(eggy.x-b.x, eggy.y-b.y) < b.danger);
      const activeThreats = bolts.filter(b => b.phase !== 'fade').length;
      ctx.textAlign='left';
      ctx.font='bold 12px -apple-system, "PingFang SC", sans-serif';
      if(level <= 2){
        ctx.fillStyle = inCore ? '#ef4444' : '#22c55e';
        ctx.fillText(inCore ? '危险：立即离开红圈！' : '安全', 8, H-8);
      }else{
        ctx.fillStyle = activeThreats >= 5 ? '#fb7185' : '#fbbf24';
        ctx.fillText(`雷暴压力 ${activeThreats}`, 8, H-8);
      }
    }

    if(started && alive){
      ctx.textAlign='right';
      ctx.font='bold 12px -apple-system, "PingFang SC", sans-serif';
      ctx.fillStyle='#c4b5fd';
      ctx.fillText(`Lv.${level} ${LEVEL_NAMES[level-1]}`, W-8, 17);
      if(boostTimer > 0){
        ctx.fillStyle='#fbbf24';
        ctx.fillText(`★ 疾跑 ${boostTimer.toFixed(1)}s`, W-8, H-8);
      }
    }

    if(started && alive && bannerTimer > 0 && survived >= 3){
      ctx.fillStyle='rgba(15,23,42,0.82)';
      ctx.fillRect(55, 48, W-110, 38);
      ctx.strokeStyle='rgba(251,191,36,0.65)'; ctx.lineWidth=1.5;
      ctx.strokeRect(55, 48, W-110, 38);
      ctx.fillStyle='#fbbf24'; ctx.textAlign='center';
      ctx.font='bold 15px -apple-system, "PingFang SC", sans-serif';
      ctx.fillText(bannerText, W/2, 72);
    }

    // 开局练习提示
    if(started && alive && survived < 3){
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, H/2 - 40, W, 80);
      ctx.fillStyle = '#fbbf24';
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px -apple-system, "PingFang SC", sans-serif';
      ctx.fillText('用 ← → ↑ ↓ 或 WASD 移动蛋仔', W/2, H/2 - 12);
      ctx.font = '13px -apple-system, "PingFang SC", sans-serif';
      ctx.fillStyle = '#e2e8f0';
      ctx.fillText('红圈亮起 = 危险区，快跑开！', W/2, H/2 + 12);
    }

    // 连击提示
    if(combo > 2){
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 16px -apple-system, sans-serif';
      ctx.textAlign='center';
      ctx.fillText(`🔥 连躲 x${combo}`, W/2, 30);
    }

    // 闪白（雷击瞬间）
    if(flashFrames > 0){
      ctx.fillStyle = `rgba(255,255,255,${flashFrames/12*0.5})`;
      ctx.fillRect(0,0,W,H);
    }

    if(paused && started){
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fbbf24'; ctx.textAlign='center';
      ctx.font='bold 30px -apple-system, sans-serif';
      ctx.fillText('⏸ 暂停', W/2, H/2);
    }

    if(!alive && started){
      ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#a78bfa'; ctx.textAlign='center';
      ctx.font='bold 34px -apple-system, sans-serif';
      ctx.fillText('💥 被劈中！', W/2, H/2 - 20);
      ctx.fillStyle='#fbbf24'; ctx.font='17px -apple-system, sans-serif';
      ctx.fillText(`存活 ${survived.toFixed(1)}s · 躲避 ${dodged} 次 · Lv.${level}`, W/2, H/2 + 10);
      if(lastDeath){
        ctx.fillStyle='#f87171'; ctx.font='12px -apple-system, sans-serif';
        ctx.fillText(`距闪电 ${lastDeath.dist}px · 致命半径 ${lastDeath.danger}px ${lastDeath.dist>lastDeath.danger?'(在圈外→本不该死!)':'(在圈内→判死)'}`, W/2, H/2 + 32);
        ctx.fillText(`蛋仔(${lastDeath.ex},${lastDeath.ey}) 闪电(${lastDeath.bx},${lastDeath.by}) · ${VERSION}`, W/2, H/2 + 50);
      }
      ctx.fillStyle='#94a3b8'; ctx.font='13px -apple-system, sans-serif';
      ctx.fillText('按 R 或"重置"再来', W/2, H/2 + (lastDeath?72:36));
    }

    if(debug){
      ctx.textAlign='left'; ctx.font='11px monospace';
      ctx.fillStyle='#22c55e';
      ctx.fillText(`dbg ${VERSION} eggy(${Math.round(eggy.x)},${Math.round(eggy.y)})`, 8, 14);
      bolts.forEach((b,i)=>{
        const d=Math.round(Math.hypot(eggy.x-b.x, eggy.y-b.y));
        ctx.fillStyle = d<b.danger ? '#ef4444' : '#22c55e';
        ctx.fillText(`#${i} ${b.phase} d=${d} R=${Math.round(b.danger)}`, 8, 28+i*14);
      });
    }
  }

  const VERSION = 'v12';
  const MAX_LEVEL = 8;
  const LEVEL_NAMES = [
    '热身', '升温', '疾风', '雷暴',
    '狂雷', '极限', '炼狱', '传说'
  ];
  let debug = false;
  let flashFrames = 0;

  function showBanner(text, duration=1.7){
    bannerText = text;
    bannerTimer = duration;
  }
  function clamp(value, min, max){ return Math.max(min, Math.min(max, value)); }

  // === 生成闪电 ===
  function chooseBoltPosition(aimed){
    if(aimed){
      const lead = level >= 4 ? 0.10 + (level-4)*0.025 : 0;
      return {
        x:clamp(eggy.x + eggy.vx*lead + (Math.random()-0.5)*14, 30, W-30),
        y:clamp(eggy.y + eggy.vy*lead + (Math.random()-0.5)*14, 38, H-48)
      };
    }
    let point = {x:W/2, y:H/2};
    const spacing = Math.max(54, 78-level*3);
    for(let attempt=0; attempt<16; attempt++){
      point = {x:32 + Math.random()*(W-64), y:42 + Math.random()*(H-96)};
      if(bolts.every(b => b.phase === 'fade' || Math.hypot(point.x-b.x, point.y-b.y) > spacing)) break;
    }
    return point;
  }

  function spawnBolt(options={}){
    const aimed = !!options.aimed;
    const point = options.point || chooseBoltPosition(aimed);
    const warning = options.warning || warnFrames;
    const baseDanger = 31 + level*2.4 + Math.random()*8;
    const danger = baseDanger * (options.scale || 1);
    const trackingTime = aimed ? warning*Math.min(0.72, 0.48+level*0.025) : 0;
    bolts.push({x:point.x, y:point.y, r:danger, danger, aimed,
      phase:'warn', timer:warning, life:warning, seed:Math.random()*10,
      trackTimer:trackingTime});
  }

  function getWaveSize(){
    const roll = Math.random();
    if(level === 1) return waveNumber < 2 || roll < 0.70 ? 1 : 2;
    if(level === 2) return roll < 0.72 ? 2 : 1;
    if(level === 3) return roll < 0.32 ? 3 : 2;
    if(level === 4) return roll < 0.72 ? 3 : 2;
    if(level === 5) return roll < 0.45 ? 4 : 3;
    if(level === 6) return roll < 0.72 ? 4 : 3;
    if(level === 7) return roll < 0.42 ? 5 : 4;
    return roll < 0.65 ? 5 : 4;
  }

  function spawnWallWave(){
    const xs = [42, 121, 200, 279, 358];
    let nearest = 0;
    for(let i=1;i<xs.length;i++) if(Math.abs(xs[i]-eggy.x) < Math.abs(xs[nearest]-eggy.x)) nearest=i;
    let direction = Math.random() < 0.5 ? -1 : 1;
    if(nearest === 0) direction = 1;
    if(nearest === xs.length-1) direction = -1;
    const gap = clamp(nearest+direction, 0, xs.length-1);
    const wallY = clamp(eggy.y + (Math.random()-0.5)*24, 70, H-70);
    const wallWarning = Math.max(58, warnFrames+8);
    xs.forEach((x,index) => {
      if(index !== gap) spawnBolt({point:{x,y:wallY}, warning:wallWarning, scale:1.08});
    });
    lastWaveSize = 4;
    showBanner('▦ 雷墙封路：冲向缺口！', 1.35);
  }

  function spawnWave(){
    const wallWave = level >= 4 && waveNumber > 0 && waveNumber % 4 === 3;
    if(wallWave){
      spawnWallWave();
    }else{
      const count = getWaveSize();
      const aimedChance = level >= 2 ? Math.min(0.82, 0.20+(level-2)*0.10) : 0;
      const hasAimedBolt = Math.random() < aimedChance;
      for(let i=0; i<count; i++) spawnBolt({aimed:hasAimedBolt && i===0});
      lastWaveSize = count;
      if(count >= 4 && bannerTimer <= 0) showBanner('⚡ 密集雷暴！', 1.15);
      else if(count >= 3 && bannerTimer <= 0) showBanner('⚡ 三重雷暴！', 1.1);
      else if(hasAimedBolt && bannerTimer <= 0) showBanner('◎ 追踪雷正在锁定！', 1.1);
    }
    waveNumber++;
    playWarn();
  }

  function update(dt){
    if(!alive || paused || !started) return;
    const step = dt * 60;
    survived += dt;

    const nextLevel = Math.min(MAX_LEVEL, 1 + Math.floor(survived/10));
    if(nextLevel > level){
      level = nextLevel;
      spawnTimer = Math.min(spawnTimer, 18);
      showBanner(`⚡ 难度提升 Lv.${level} · ${LEVEL_NAMES[level-1]}`, 2.0);
      playWarn();
    }
    difficulty = level;
    warnFrames = Math.max(34, 81 - level*6);
    const spawnInterval = Math.max(32, 110 - level*11);

    if(survived >= 2.2){
      spawnTimer -= step;
      if(spawnTimer <= 0){
        const activeThreats = bolts.filter(b => b.phase !== 'fade').length;
        const activeLimit = 3 + level;
        if(activeThreats < activeLimit) spawnWave();
        spawnTimer = activeThreats >= activeLimit ? 18 : spawnInterval;
      }
    }

    boostTimer = Math.max(0, boostTimer-dt);
    bannerTimer = Math.max(0, bannerTimer-dt);

    let dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    let dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    let speed = 380 + (level-1)*5;
    if(dx || dy){
      pointerTarget = null;
    }else if(pointerTarget){
      dx = pointerTarget.x-eggy.x;
      dy = pointerTarget.y-eggy.y;
      speed = 465 + (level-1)*4;
      if(Math.hypot(dx,dy) < 3){ pointerTarget = null; dx = 0; dy = 0; }
    }
    eggy.vx = 0; eggy.vy = 0;
    if(dx || dy){
      const length = Math.hypot(dx, dy);
      speed *= boostTimer > 0 ? 1.18 : 1;
      const distance = Math.min(length, speed*dt);
      eggy.vx = dx/length*speed;
      eggy.vy = dy/length*speed;
      eggy.x += dx/length*distance;
      eggy.y += dy/length*distance;
      eggy.squash = Math.max(eggy.squash, boostTimer > 0 ? 0.55 : 0.35);
    }
    eggy.x = clamp(eggy.x, eggy.r, W-eggy.r);
    eggy.y = clamp(eggy.y, eggy.r, H-eggy.r);
    eggy.squash *= Math.pow(0.85, step);
    if(eggy.blink > 0) eggy.blink = Math.max(0, eggy.blink-dt);
    else if(Math.random() < dt/2.2) eggy.blink = 0.13;
    flashFrames = Math.max(0, flashFrames-step);

    let eggyInDanger = false;
    let dodgesThisTick = 0;
    let boltSoundPlayed = false;
    for(const b of bolts){
      b.timer -= step;
      if(b.phase === 'warn'){
        if(b.aimed && b.trackTimer > 0){
          b.trackTimer = Math.max(0, b.trackTimer-step);
          const follow = 1-Math.pow(0.78, step);
          b.x = clamp(b.x+(eggy.x-b.x)*follow, 30, W-30);
          b.y = clamp(b.y+(eggy.y-b.y)*follow, 38, H-48);
        }
        const distance = Math.hypot(eggy.x-b.x, eggy.y-b.y);
        if(distance < b.danger) eggyInDanger = true;
        if(b.timer <= 0){
          b.phase = 'strike';
          const strikeLife = Math.max(14, Math.floor(b.life*0.30));
          b.timer = strikeLife; b.life = strikeLife;
          flashFrames = Math.max(flashFrames, 9);
          if(!boltSoundPlayed){ playBolt(); boltSoundPlayed = true; }
          if(distance < b.danger){
            lastDeath = {dist:Math.round(distance), danger:Math.round(b.danger),
              ex:Math.round(eggy.x), ey:Math.round(eggy.y), bx:Math.round(b.x),
              by:Math.round(b.y), frame:Math.round(frame)};
            gameOver();
            return;
          }
          dodgesThisTick++;
        }
      }else if(b.phase === 'strike' && b.timer <= 0){
        b.phase = 'fade'; b.timer = 14; b.life = 14;
      }else if(b.phase === 'fade' && b.timer <= 0){
        b.dead = true;
      }
    }

    if(dodgesThisTick > 0){
      const previousCombo = combo;
      dodged += dodgesThisTick;
      combo += dodgesThisTick;
      if(Math.floor(combo/5) > Math.floor(previousCombo/5)){
        boostTimer = 2.5;
        showBanner('★ 连躲奖励：疾跑 2.5 秒！', 1.6);
      }
    }

    eggy.inDanger = eggyInDanger;
    bolts = bolts.filter(b => !b.dead);
    frame += step;
    updateStats();
  }

  function updateStats(){
    timeEl.textContent = survived.toFixed(1);
    dodgeEl.textContent = dodged;
    comboEl.textContent = 'x' + combo;
    levelEl.textContent = 'Lv.' + level;
    levelEl.title = LEVEL_NAMES[level-1] || '';
    if(survived > best){ best = survived; bestEl.textContent = best.toFixed(1); }
  }

  function gameOver(){
    alive = false;
    combo = 0;
    boostTimer = 0;
    bannerTimer = 0;
    eggy.inDanger = false;
    saveBest();
    updateStats();
  }

  // === 控制 ===
  const keys = { left:false, right:false, up:false, down:false };
  function clearKeys(){ keys.left = keys.right = keys.up = keys.down = false; }
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if(k==='arrowleft'||k==='a'){ keys.left=true; e.preventDefault(); }
    else if(k==='arrowright'||k==='d'){ keys.right=true; e.preventDefault(); }
    else if(k==='arrowup'||k==='w'){ keys.up=true; e.preventDefault(); }
    else if(k==='arrowdown'||k==='s'){ keys.down=true; e.preventDefault(); }
    else if(k===' '){ togglePause(); e.preventDefault(); }
    else if(k==='r'){ startGame(); e.preventDefault(); }
    else if(k==='i'){ debug=!debug; draw(); e.preventDefault(); }
    else if(k==='enter' && !started){ startGame(); e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if(k==='arrowleft'||k==='a') keys.left=false;
    else if(k==='arrowright'||k==='d') keys.right=false;
    else if(k==='arrowup'||k==='w') keys.up=false;
    else if(k==='arrowdown'||k==='s') keys.down=false;
  });
  window.addEventListener('blur', () => {
    clearKeys(); dragging = false;
    if(started && alive && !paused){ paused = true; pauseBtn.textContent = '继续'; draw(); }
  });

  let dragging = false;
  function pointerPos(e){
    const rect = canvas.getBoundingClientRect();
    return {x:(e.clientX-rect.left)*(W/rect.width), y:(e.clientY-rect.top)*(H/rect.height)};
  }
  function setPointerTarget(e){
    const p = pointerPos(e);
    pointerTarget = {x:clamp(p.x, eggy.r, W-eggy.r), y:clamp(p.y, eggy.r, H-eggy.r)};
  }
  canvas.addEventListener('pointerdown', e => {
    if(!started || !alive || paused) return;
    dragging = true;
    if(canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    setPointerTarget(e);
    eggy.squash = 0.45;
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    if(!dragging || !started || !alive || paused) return;
    setPointerTarget(e);
    e.preventDefault();
  });
  function stopDragging(e){
    dragging = false;
    if(e && canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  }
  canvas.addEventListener('pointerup', stopDragging);
  canvas.addEventListener('pointercancel', stopDragging);

  function startGame(){
    if(started) saveBest();
    if(rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
    clearKeys(); dragging = false; pointerTarget = null; bolts = [];
    eggy.x = W/2; eggy.y = H*0.7;
    eggy.vx=0; eggy.vy=0; eggy.squash=0; eggy.blink=0; eggy.inDanger=false;
    survived = 0; dodged = 0; combo = 0; difficulty = 1; level = 1;
    boostTimer = 0; bannerTimer = 0; bannerText = ''; waveNumber = 0; lastWaveSize = 1;
    alive = true; paused = false; started = true;
    spawnTimer = 40; warnFrames = 75; frame = 0; flashFrames = 0; lastDeath = null;
    startBtn.textContent = '重新开始';
    pauseBtn.textContent = '暂停';
    unlockAudio(); updateStats(); lastT = null; draw(); ensureLoop();
  }

  function togglePause(){
    if(!started || !alive) return;
    paused = !paused; clearKeys();
    pauseBtn.textContent = paused ? '继续' : '暂停';
    lastT = null; draw(); if(!paused) ensureLoop();
  }

  startBtn.addEventListener('click', startGame);
  pauseBtn.addEventListener('click', togglePause);
  resetBtn.addEventListener('click', startGame);
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇 静音' : '🔊 音效';
    if(!muted) unlockAudio();
  });
  window.addEventListener('pagehide', saveBest);

  let lastT = null;
  let rafId = null;
  function ensureLoop(){
    if(rafId === null && started && alive && !paused) rafId = requestAnimationFrame(loop);
  }
  function loop(t){
    rafId = null;
    if(!started || !alive || paused){ draw(); return; }
    if(lastT === null) lastT = t;
    const dt = Math.min(0.05, Math.max(0, (t-lastT)/1000));
    lastT = t;
    update(dt); draw(); ensureLoop();
  }

  startBtn.textContent = '开始';
  updateStats();
  draw();

})();
</script>
</body>
</html>
